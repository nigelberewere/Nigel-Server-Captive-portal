# Reference deployment example. Copy values into /etc/nigel/nigel.conf after review.
NIGEL_PROFILE=standalone-ap
AP_IFACE=wlo1
CLIENT_IFACE=wlo1
SUBNET=10.0.0.0/24
DHCP_START=10.0.0.10
DHCP_END=10.0.0.250
LEASE_TIME=12h
SSID=Nigel Server
COUNTRY_CODE=ZW
BAND=g
CHANNEL=6
PORTAL_NAME=Nigel Server
STRICT=1
GUEST_ENABLED=false
NIGEL_TIMEZONE=system
NETWORK_BACKEND=networkd
BOOT_MODE=hotspot
