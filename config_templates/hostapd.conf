# /etc/hostapd/hostapd.conf template for Nigel Server

interface=wlan0
driver=nl80211

# SSID of the hotspot
ssid=Nigel Hotspot
hw_mode=g
channel=6

# Open network (No password, captive portal handles auth)
# For WPA2, uncomment the following:
# wpa=2
# wpa_passphrase=YourSecretPassword
# wpa_key_mgmt=WPA-PSK
# rsn_pairwise=CCMP

macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
