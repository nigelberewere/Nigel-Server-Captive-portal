# /etc/hostapd/hostapd.conf template for Nigel Server

interface=${WIFI_IFACE}
driver=nl80211
country_code=ZW

# SSID of the hotspot
ssid=${WIFI_SSID}
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
ht_capab=[HT20]
ctrl_interface=/var/run/hostapd

# Open network (No password, captive portal handles auth)
# Setup may append WPA2 settings when a passphrase is supplied.

macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
