# /etc/dnsmasq.conf template for Nigel Server

# Never forward plain names (without a dot or domain part)
domain-needed
# Never forward addresses in the non-routed address spaces
bogus-priv

# Listen on the WiFi interface
interface=wlan0
listen-address=10.0.0.1
bind-dynamic

# Authoritative DHCP prevents clients (like iPads/iPhones) from getting stuck on old leases
dhcp-authoritative

# DHCP range and subnet
dhcp-range=10.0.0.10,10.0.0.250,255.255.255.0,12h

# DHCP Options: Gateway (Option 3) & DNS (Option 6)
dhcp-option=3,10.0.0.1
dhcp-option=6,10.0.0.1

# RFC 8910 / RFC 7710 Captive Portal notification for iOS, Android, and Windows
dhcp-option=114,http://10.0.0.1:5000/
dhcp-option=160,http://10.0.0.1:5000/

# Wildcard DNS to redirect everything to the captive portal
address=/#/10.0.0.1

