# /etc/dnsmasq.conf template for Nigel Server

# Never forward plain names (without a dot or domain part)
domain-needed
# Never forward addresses in the non-routed address spaces
bogus-priv
no-resolv
no-poll

# Listen on the WiFi interface
interface=${WIFI_IFACE}
listen-address=${NIGEL_WIFI_IP}
bind-dynamic

# Authoritative DHCP prevents clients (like iPads/iPhones) from getting stuck on old leases
dhcp-authoritative
log-dhcp
dhcp-leasefile=/var/lib/misc/nigel-dnsmasq.leases

# DHCP range and subnet
dhcp-range=${NIGEL_DHCP_START},${NIGEL_DHCP_END},${NIGEL_WIFI_NETMASK},12h

# DHCP Options: Gateway (Option 3) & DNS (Option 6)
dhcp-option=3,${NIGEL_WIFI_IP}
dhcp-option=6,${NIGEL_WIFI_IP}

# Windows NCSI DNS probe resolution (tells Windows internet is verified)
address=/dns.msftncsi.com/131.107.255.255

# Wildcard DNS to redirect everything else to the captive portal
address=/#/${NIGEL_WIFI_IP}

